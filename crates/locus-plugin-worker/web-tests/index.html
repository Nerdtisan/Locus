<!--
  The §15.8 suite against the web plugin host, in a browser (#254).

-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Locus web plugin host tests</title>
  <link data-trunk rel="rust" href="../Cargo.toml" data-bin="locus-plugin-worker"
    data-type="worker" data-loader-shim data-wasm-opt="z"
    data-wasm-opt-params="--enable-bulk-memory --enable-nontrapping-float-to-int --enable-sign-ext --enable-mutable-globals" />
  <link data-trunk rel="copy-file" href="run.js" />
</head>
<body>
  <pre id="out">running…</pre>
  <script src="run.js"></script>
