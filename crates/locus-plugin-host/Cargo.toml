[package]
name = "locus-plugin-host"
description = "wasmtime plugin runtime with capability enforcement"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde.workspace = true
thiserror.workspace = true
toml = { version = "1.2", default-features = false, features = ["parse", "serde", "std"] }

# Desktop-only (SPEC §0, #181): the web build never links wasmtime.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wasmtime = { version = "50.0.1", default-features = false, features = [
    "std",
    "runtime",
    "cranelift",
    "component-model",
    "wat",
] }
# .locusplugin archives (§15.7): read and write zip, deflate via zlib-rs.
zip = { version = "9.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
sha2 = "0.10"
# `pack`: wraps a wit-bindgen core module into a component (#185).
wit-component = "0.261"

[dev-dependencies]
# Builds the §15.8 fixture components from hand-written core WAT in tests, so
# the sandbox suite needs no wasm toolchain and runs on every CI platform.
wat = "1.263"
wit-parser = "0.261"
