[package]
name = "locus-app"
description = "Locus desktop and web GUI shell"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "locus"
path = "src/main.rs"

[dependencies]
locus-geom.workspace = true
locus-doc.workspace = true
locus-region.workspace = true
locus-stroke.workspace = true
locus-export.workspace = true
locus-text.workspace = true
locus-import.workspace = true
locus-trace.workspace = true
eframe.workspace = true
egui.workspace = true
egui_dock.workspace = true
serde.workspace = true
tracing.workspace = true
serde_json.workspace = true
# Plugins: wasmtime on desktop, the core-module host in a Web Worker on the
# web (SPEC §15, ADR 0016).
locus-plugin-host.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = ["Window", "Document", "HtmlCanvasElement", "console"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd.workspace = true
# The MCP server is desktop-only too (SPEC §0, §16).
locus-mcp = { path = "../locus-mcp" }

# Installed fonts from the OS (#477, ADR 0019 decision 7): safe wrappers
# over DirectWrite and Core Text, so the workspace's `unsafe_code = "deny"`
# holds. Linux asks fontconfig through `fc-list`.
[target.'cfg(windows)'.dependencies]
dwrote = { version = "0.11", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
core-text = "22"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# Drives an MCP call from another thread in the canvas test (#230).
tokio = { version = "1", features = ["rt"] }

# Encode test images and damage them inside a `.locus` file (#390).
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.23"
