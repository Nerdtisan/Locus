[package]
name = "locus-app"
description = "Locus desktop and web GUI shell"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "locus"
path = "src/main.rs"

[dependencies]
locus-geom.workspace = true
locus-doc.workspace = true
locus-region.workspace = true
locus-export.workspace = true
locus-text.workspace = true
eframe.workspace = true
egui.workspace = true
egui_dock.workspace = true
serde.workspace = true
tracing.workspace = true
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = ["Window", "Document", "HtmlCanvasElement", "console"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd.workspace = true
# Plugins are desktop-only (SPEC §0, §15).
locus-plugin-host.workspace = true
