[package]
name = "locus-app"
description = "Locus desktop and web GUI shell"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "locus"
path = "src/main.rs"

[dependencies]
locus-geom.workspace = true
locus-doc.workspace = true
locus-region.workspace = true
locus-export.workspace = true
locus-text.workspace = true
locus-import.workspace = true
eframe.workspace = true
egui.workspace = true
egui_dock.workspace = true
serde.workspace = true
tracing.workspace = true
serde_json.workspace = true
# Plugins: wasmtime on desktop, the core-module host in a Web Worker on the
# web (SPEC §15, ADR 0016).
locus-plugin-host.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = ["Window", "Document", "HtmlCanvasElement", "console"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd.workspace = true
# The MCP server is desktop-only too (SPEC §0, §16).
locus-mcp = { path = "../locus-mcp" }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# Drives an MCP call from another thread in the canvas test (#230).
tokio = { version = "1", features = ["rt"] }

