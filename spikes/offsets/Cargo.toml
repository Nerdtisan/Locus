# Standalone spike workspace (#161, ADR 0010): not part of the root workspace.
[package]
name = "offsets-spike"
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[workspace]

[lib]
crate-type = ["rlib", "cdylib"]

[features]
wasm-own = []
wasm-cav = []

[dependencies]
cavalier_contours = "0.9.0"
locus-geom = { path = "../../crates/locus-geom" }
locus-region = { path = "../../crates/locus-region" }

[profile.release]
debug = false
strip = true

[profile.wasm]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
