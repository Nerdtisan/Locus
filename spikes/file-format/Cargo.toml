# Throwaway spike for ADR-0004 (RON vs JSON, SPEC §10) and ADR-0003 (entity
# IDs, SPEC §4). Standalone: its own [workspace] keeps it out of the main
# workspace, its lockfile and its CI gate.
[workspace]

[package]
name = "file-format-spike"
version = "0.0.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = ["ron", "json"]
ron = ["dep:ron"]
json = ["dep:serde_json"]
uuid = ["dep:uuid"]
# wasm32 only: lets uuid read the clock and RNG through JS (ADR-0003).
uuid-js = ["uuid", "uuid/js"]

[dependencies]
serde = { version = "1", features = ["derive"] }
ron = { version = "0.12", optional = true }
serde_json = { version = "1", optional = true }

# Only for the ADR-0003 ID comparison; not part of either format candidate.
uuid = { version = "1", features = ["v7", "serde"], optional = true }

[[bin]]
name = "spike"
path = "src/bin/spike.rs"
required-features = ["ron", "json", "uuid"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
