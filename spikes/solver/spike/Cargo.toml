[package]
name = "solver-spike"
description = "Candidate solver backends on the harness: SolidCraft (#39), ezpz (#40)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# cdylib: the wasm32 build loaded by web/index.html; rlib: the native runners.
crate-type = ["cdylib", "rlib"]

[dependencies]
solver-harness = { path = "../harness" }
# SolidCraft's sketch crate (MIT OR Apache-2.0), pinned to the commit assessed in
# ADR 0002. Not on crates.io; its own git dependency (solidcore-record) comes along.
solidcraft-sketch = { git = "https://github.com/tangency-labs/solidcraft", rev = "6178d1a45e3076328fb9cb4871139305f73e8236", optional = true }
# Same rev SolidCraft pins, for its Vec2 type.
solidcore-record = { git = "https://github.com/tangency-labs/solidcore", rev = "f5e8e9a29e0c9b7cf6c4040a5bc8878382b3c62f", optional = true }
# KittyCAD/Zoo's sketch solver (MIT).
ezpz = { version = "=0.2.29", optional = true }
# ADR 0007: sparse Cholesky for the own-LM candidate (no `paste` in its tree).
nalgebra-sparse = { version = "0.12", optional = true, default-features = false }
nalgebra = { version = "0.35", optional = true, default-features = false, features = ["std"] }

[features]
# One feature per candidate, so each backend's wasm size can be measured alone.
default = ["solidcraft", "ezpz", "nalgebra"]
nalgebra = ["dep:nalgebra-sparse", "dep:nalgebra"]
solidcraft = ["dep:solidcraft-sketch", "dep:solidcore-record"]
ezpz = ["dep:ezpz"]

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = { version = "0.8", default-features = false }

[[bench]]
name = "solver"
harness = false
required-features = ["solidcraft", "ezpz"]
