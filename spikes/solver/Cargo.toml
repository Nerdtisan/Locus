# Solver spike workspace (issues #41, #39, #40; SPEC §3, §13 M0).
#
# Standalone on purpose: its own [workspace] table keeps candidate solver
# dependencies (SolidCraft, ezpz, criterion) out of the core crates and out of
# the root Cargo.lock. `harness/` has no dependencies and is written to move into
# `locus-solver` in M1; `spike/` holds the backend adapters and the runners.
[workspace]
resolver = "2"
members = ["harness", "spike"]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false

[profile.release]
debug = "line-tables-only"

[profile.bench]
debug = "line-tables-only"
