# Spike B (#45, SPEC §12.1, §12.2, §13 M0): the reference canvas on
# Bevy 0.17 + bevy_egui + egui_dock.
# A standalone workspace (empty [workspace] table) so it stays out of the root
# workspace, its Cargo.lock and CI. Versions match the user's Bevy simulator.
[workspace]

[package]
name = "locus-spike-gui-bevy"
version = "0.0.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false

[[bin]]
name = "locus-spike-bevy"
path = "src/main.rs"

[dependencies]
# Only what the canvas needs: window + winit, the renderer, the 2D gizmo
# pipeline (bevy_sprite_render hosts it) and logging. No audio, gamepads,
# PBR, text, UI, scenes or image formats.
bevy = { version = "=0.17.3", default-features = false, features = [
    "std",
    "bevy_asset",
    "bevy_winit",
    "bevy_window",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_gizmos",
    "bevy_sprite_render",
    "bevy_log",
] }
bevy_egui = { version = "=0.38.1", default-features = false, features = ["render", "default_fonts"] }
egui_dock = "=0.18.0"

[features]
# PNG encoding for the `--bench` screenshots only; off in the measured builds.
capture = ["bevy/png"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { version = "=0.17.3", default-features = false, features = ["multi_threaded"] }

# winit needs a window backend on Linux. x11 loads libX11 at run time (x11-dl),
# so no X11 development packages are needed in the container.
[target.'cfg(target_os = "linux")'.dependencies]
bevy = { version = "=0.17.3", default-features = false, features = ["x11"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# WebGL2 for the widest browser support; `web` wires up the browser platform.
bevy = { version = "=0.17.3", default-features = false, features = ["webgl2", "web"] }
# Reads `?bench` from the page URL (already in the tree via winit/wgpu).
web-sys = { version = "0.3", features = ["Window", "Location"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true

# The web build: size over speed (`trunk build --release --cargo-profile wasm-release`).
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1

# Keep dependency builds optimised in dev too; Bevy is unusably slow otherwise.
[profile.dev.package."*"]
opt-level = 2
