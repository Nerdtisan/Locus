[package]
name = "locus-finger-box"
description = "Finger-joint box generator: a first-party example Locus plugin"
version = "1.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
locus-plugin-api = { path = "../../crates/locus-plugin-api" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# A standalone project, not part of the Locus workspace.
[workspace]
