# .github/workflows/release.yml
#
# Private build artefacts for every installer (SPEC §0 Packaging, §13 M4; epic #29, #244).
#
# Owner decision: PRIVATE builds only. Nothing here creates a GitHub Release or
# publishes anywhere; every installer is uploaded as a workflow artefact (14-day
# retention) from a manual dispatch or a `v*` tag. There is no Flathub submission.
#
# Unsigned for now. Each platform has a clearly marked signing step that does
# nothing until its secret exists, so certificates can be added later as GitHub
# secrets (Settings > Secrets > Actions) without editing the packaging steps.
# NEVER put a certificate, key or password in the repo, the Dockerfile or this file.
#
# Pull requests that touch packaging run this workflow too, so packaging changes are
# proven before they merge (workflow_dispatch only works once the file is on the
# default branch).

name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "packaging/**"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  # How long installer artefacts are kept (private builds, no Release).
  RETENTION_DAYS: 14

jobs:
  version:
    name: Stamp version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        # Tag `v1.2.3` -> 1.2.3. Otherwise the Cargo.toml workspace version plus
        # the short commit, so dispatch builds are traceable and sort below tags.
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            v="${GITHUB_REF_NAME#v}"
          else
            base=$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version *= *"\(.*\)"/\1/p}' Cargo.toml | head -n1)
            v="${base}-dev.${GITHUB_SHA::7}"
          fi
          [[ "$v" =~ ^[0-9A-Za-z.+-]+$ ]] || { echo "bad version: $v"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

  # One container build of the release binaries for Linux and Windows; the
  # package jobs below only wrap them. macOS builds its own (native only).
  build:
    name: Release binaries (dev container)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Cache the crate registry
        uses: actions/cache@v6
        with:
          path: |
            .cargo-home/registry/index
            .cargo-home/registry/cache
            .cargo-home/git/db
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Build dev container image
        run: docker build -t locus-dev .devcontainer

      - name: Build Linux and Windows release binaries
        # `--user root` and the final chown: same reasoning as ci.yml.
        run: |
          D="docker run --rm --user root -e CARGO_HOME=/workspace/.cargo-home -e CARGO_INCREMENTAL -v ${{ github.workspace }}:/workspace -w /workspace locus-dev"
          $D cargo build --release --locked -p locus-app -p locus-cli
          $D cargo build --release --locked --target x86_64-pc-windows-gnu -p locus-app -p locus-cli
          mkdir -p bin/linux bin/windows
          cp target/release/locus target/release/locus-cli bin/linux/
          cp target/x86_64-pc-windows-gnu/release/locus.exe target/x86_64-pc-windows-gnu/release/locus-cli.exe bin/windows/
          sudo chown -R "$(id -u):$(id -g)" .cargo-home target

      - name: Smoke-test the Linux CLI
        run: bin/linux/locus-cli profiles

      - uses: actions/upload-artifact@v7
        with:
          name: bin-linux
          path: bin/linux
          retention-days: 1
      - uses: actions/upload-artifact@v7
        with:
          name: bin-windows
          path: bin/windows
          retention-days: 1

  # -- Windows: Inno Setup installer + portable zip (#245) ---------------------
  windows:
    name: Windows installer + zip
    needs: [version, build]
    runs-on: windows-2025
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # Pinned Inno Setup (SHA-256 is the one GitHub publishes for the release asset).
      INNO_VERSION: "7.1.1"
      INNO_SHA256: "8a5a6711c3766a6e5fb74f280ba0e3551e719ce94538d901fdbd1f8f9920b3f0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: bin-windows
          path: bin

      - name: Portable zip
        shell: pwsh
        run: |
          $d = "dist/Locus-$env:VERSION-windows-portable"
          New-Item -ItemType Directory -Force $d | Out-Null
          Copy-Item bin/locus.exe, bin/locus-cli.exe, LICENSE, THIRD-PARTY-NOTICES.md $d
          Copy-Item packaging/windows/PORTABLE.txt $d/README.txt
          Compress-Archive -Path $d -DestinationPath "dist/Locus-$env:VERSION-windows-portable.zip"

      - name: Install Inno Setup (pinned)
        shell: pwsh
        run: |
          $url = "https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-$env:INNO_VERSION-x64.exe"
          Invoke-WebRequest $url -OutFile "$env:RUNNER_TEMP/inno.exe"
          $h = (Get-FileHash "$env:RUNNER_TEMP/inno.exe" -Algorithm SHA256).Hash.ToLower()
          if ($h -ne $env:INNO_SHA256) { throw "Inno Setup hash mismatch: $h" }
          Start-Process "$env:RUNNER_TEMP/inno.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-" -Wait
          $roots = @($env:ProgramFiles, ${env:ProgramFiles(x86)}, "$env:LOCALAPPDATA/Programs") | Where-Object { $_ -and (Test-Path $_) }
          $iscc = Get-ChildItem $roots -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.FullName -like '*Inno Setup*' } | Select-Object -First 1 -ExpandProperty FullName
          if (-not $iscc) { throw "ISCC.exe not found after install" }
          "ISCC=$iscc" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Compile the installer
        shell: pwsh
        run: |
          # AppVersion is free text in Inno; it also names the output file.
          & $env:ISCC "/DAppVersion=$env:VERSION" "/DSourceDir=$PWD/bin" "/DOutDir=$PWD/dist" packaging/windows/locus.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Get-ChildItem dist

      - name: Sign (stub - runs only once a certificate secret exists)
        # To enable: add WINDOWS_CERT_PFX_BASE64 + WINDOWS_CERT_PASSWORD as Actions
        # secrets, then replace the body with a signtool invocation over
        # dist/*-setup.exe (and the exes before they are zipped/compiled).
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
        if: env.WINDOWS_CERT_PFX_BASE64 != ''
        shell: pwsh
        run: Write-Warning "Windows signing is not implemented yet; artefacts stay unsigned."

      - name: Smoke test - zip
        shell: pwsh
        run: |
          Expand-Archive "dist/Locus-$env:VERSION-windows-portable.zip" "$env:RUNNER_TEMP/zip"
          & "$env:RUNNER_TEMP/zip/Locus-$env:VERSION-windows-portable/locus-cli.exe" profiles
          if ($LASTEXITCODE -ne 0) { throw "locus-cli failed from the zip" }

      - name: Smoke test - install, associate, uninstall
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP/locus-inst"
          $setup = Get-ChildItem dist -Filter *-setup.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$dir" -Wait
          foreach ($f in "locus.exe","locus-cli.exe","locus.ico") { if (-not (Test-Path "$dir/$f")) { throw "missing $f" } }
          & "$dir/locus-cli.exe" profiles
          if ($LASTEXITCODE -ne 0) { throw "locus-cli failed after install" }
          $cmd = (Get-ItemProperty "HKCU:/Software/Classes/Locus.Document/shell/open/command").'(default)'
          if ($cmd -notlike '*locus.exe*%1*') { throw "bad .locus open command: $cmd" }
          if ((Get-ItemProperty "HKCU:/Software/Classes/.locus").'(default)' -ne 'Locus.Document') { throw ".locus not associated" }
          if (-not (Test-Path "HKCU:/Software/Classes/.locusplugin")) { throw ".locusplugin not associated" }
          Start-Process "$dir/unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          Start-Sleep 3
          if (Test-Path "$dir/locus.exe") { throw "uninstall left locus.exe" }
          if (Test-Path "HKCU:/Software/Classes/.locus") { throw "uninstall left the .locus association" }

      - uses: actions/upload-artifact@v7
        with:
          name: installer-windows
          path: |
            dist/*-setup.exe
            dist/*.zip
          retention-days: ${{ env.RETENTION_DAYS }}

  # -- macOS: universal .app in a .dmg (#246) ----------------------------------
  macos:
    name: macOS universal dmg
    needs: [version]
    runs-on: macos-15
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Install the container's Rust toolchain
        # Keep in step with RUST_VERSION in .devcontainer/Dockerfile and ci.yml.
        run: |
          rustup toolchain install 1.99.1 --profile minimal --target aarch64-apple-darwin --target x86_64-apple-darwin
          rustup default 1.99.1

      - name: Build both architectures
        run: |
          cargo build --release --locked -p locus-app -p locus-cli --target aarch64-apple-darwin
          cargo build --release --locked -p locus-app -p locus-cli --target x86_64-apple-darwin
          mkdir -p bin
          for b in locus locus-cli; do
            lipo -create -output "bin/$b" "target/aarch64-apple-darwin/release/$b" "target/x86_64-apple-darwin/release/$b"
            lipo -archs "bin/$b"
          done

      - name: Sign identity (stub - Developer ID once secrets exist)
        # To enable: add MACOS_CERT_P12_BASE64 + MACOS_CERT_PASSWORD, import the
        # certificate into a temporary keychain here, and export SIGN_IDENTITY
        # (e.g. "Developer ID Application: Name (TEAMID)") via $GITHUB_ENV.
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
        if: env.MACOS_CERT_P12_BASE64 != ''
        run: echo "::warning::macOS signing is not implemented yet; the app stays ad-hoc signed."

      - name: Build Locus.app and the dmg
        run: bash packaging/macos/build-dmg.sh "$VERSION" bin/locus bin/locus-cli dist

      - name: Notarise (stub - needs an Apple Developer account)
        # To enable: add APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD, then run
        # `xcrun notarytool submit dist/*.dmg --wait` and `xcrun stapler staple`.
        env:
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        if: env.APPLE_APP_PASSWORD != ''
        run: echo "::warning::notarisation is not implemented yet; Gatekeeper will warn."

      - name: Smoke test - mount, universal, launch
        run: |
          set -euo pipefail
          dmg=$(ls dist/*.dmg)
          mnt=$(mktemp -d)
          hdiutil attach "$dmg" -mountpoint "$mnt" -nobrowse -quiet
          app="$mnt/Locus.app"
          lipo -archs "$app/Contents/MacOS/locus"
          lipo -archs "$app/Contents/MacOS/locus" | grep -q arm64
          lipo -archs "$app/Contents/MacOS/locus" | grep -q x86_64
          codesign --verify --deep --strict "$app"
          "$app/Contents/Resources/locus-cli" profiles > /dev/null
          # Launch the GUI binary: it must still be running after a few seconds.
          "$app/Contents/MacOS/locus" > "$RUNNER_TEMP/locus.log" 2>&1 &
          pid=$!
          sleep 10
          if kill -0 "$pid" 2>/dev/null; then echo "launched ok"; kill "$pid"; else
            echo "locus exited early:"; cat "$RUNNER_TEMP/locus.log"; exit 1; fi
          hdiutil detach "$mnt" -quiet

      - uses: actions/upload-artifact@v7
        with:
          name: installer-macos
          path: dist/*.dmg
          retention-days: ${{ env.RETENTION_DAYS }}

  # Collects every installer artefact into SHA256SUMS. `needs` grows with each
  # packaging job (#245-#249).
  checksums:
    name: SHA-256 sums
    needs: [version, build, windows, macos]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - run: mkdir -p out # the download creates it only when something matches
      - uses: actions/download-artifact@v8
        with:
          pattern: installer-*
          path: out
          merge-multiple: true
      - name: Write SHA256SUMS
        working-directory: out
        run: |
          shopt -s nullglob
          files=(*)
          if [ ${#files[@]} -eq 0 ]; then echo "::notice::no installer artefacts yet"; echo "empty=1" >> "$GITHUB_ENV"; exit 0; fi
          sha256sum -- "${files[@]}" | tee SHA256SUMS
      - if: env.empty != '1'
        uses: actions/upload-artifact@v7
        with:
          name: SHA256SUMS-${{ needs.version.outputs.version }}
          path: out/SHA256SUMS
          retention-days: ${{ env.RETENTION_DAYS }}
