# SPEC §3: one Cargo workspace. Core crates are UI-agnostic and must build for
# wasm32-unknown-unknown; only locus-app may depend on a GUI framework.
[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Nerdtisan/Locus"
# Matches the egui/eframe 0.35 floor used by Parchment, so either GUI spike (§12.1) fits.
rust-version = "1.92"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
