# SPEC §3: one Cargo workspace. Core crates are UI-agnostic and must build for
# wasm32-unknown-unknown; only locus-app may depend on a GUI framework.
[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Nerdtisan/Locus"
# Always the latest stable Rust (owner decision, 2026-11-04). Bump together with
# RUST_VERSION in .devcontainer/Dockerfile and the macOS job in ci.yml.
rust-version = "1.99"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
